services:
  - type: web
    name: revenue-recovery-backend
    env: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: revenue-recovery-db
          property: connectionString
      - key: PORT
        value: "4000"
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_API_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: psql
    name: revenue-recovery-db
    plan: free
